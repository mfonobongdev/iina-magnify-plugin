<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* IINA hit-tests with elementFromPoint, so every interactive element needs
     pointer-events enabled AND a data-clickable attribute. */
  #magnifier {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 220px;
    background: rgba(20, 20, 20, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 8px;
    overflow: hidden;
    backdrop-filter: blur(8px);
    display: none;
  }

  #magnifier.visible { display: block; }

  /* Wireframe navigator: the full video frame in miniature */
  #frame {
    position: relative;
    width: 100%;
    background:
      linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
    background-size: 20% 20%;
    pointer-events: auto;
    cursor: crosshair;
  }

  /* Current viewport within the frame */
  #viewport {
    position: absolute;
    border: 2px solid #4a9eff;
    border-radius: 2px;
    background: rgba(74, 158, 255, 0.15);
    box-shadow: 0 0 6px rgba(74, 158, 255, 0.5);
    pointer-events: auto;
    cursor: grab;
  }

  #viewport.dragging { cursor: grabbing; }

  .pan-arrow {
    position: absolute;
    width: 14px;
    height: 14px;
    padding: 0;
    border: none;
    border-radius: 3px;
    background: rgba(20, 20, 20, 0.9);
    color: rgba(255, 255, 255, 0.92);
    font-size: 9px;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    pointer-events: auto;
    z-index: 2;
  }

  .pan-arrow.against-edge {
    opacity: 0.3;
    cursor: default;
  }

  #sliderRow {
    padding: 7px 8px 2px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  #zoomSlider,
  #rotateSlider {
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.2);
    outline: none;
    cursor: pointer;
  }

  #rotateSlider { flex: 1; width: auto; }

  #zoomSlider::-webkit-slider-thumb,
  #rotateSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #4a9eff;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 5px 6px;
  }

  #toolbar button,
  #rotateRow button {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 4px;
    color: rgba(255, 255, 255, 0.9);
    width: 24px;
    height: 22px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  #toolbar button:hover,
  #rotateRow button:hover { background: rgba(255, 255, 255, 0.22); }

  #rotateRow {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px 7px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  #zoomLabel {
    flex: 1;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  #rotateLabel {
    flex-shrink: 0;
    width: 42px;
    text-align: right;
    color: rgba(255, 255, 255, 0.85);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="magnifier">
  <div id="frame" data-clickable>
    <div id="viewport" data-clickable></div>
    <button id="panUp" class="pan-arrow" type="button" data-clickable title="Pan up">↑</button>
    <button id="panDown" class="pan-arrow" type="button" data-clickable title="Pan down">↓</button>
    <button id="panLeft" class="pan-arrow" type="button" data-clickable title="Pan left">←</button>
    <button id="panRight" class="pan-arrow" type="button" data-clickable title="Pan right">→</button>
  </div>
  <div id="sliderRow">
    <input id="zoomSlider" data-clickable type="range" min="0" max="4" step="0.05" value="0" title="Zoom" />
  </div>
  <div id="toolbar">
    <button id="btnOut" data-clickable title="Zoom out (-)">−</button>
    <button id="btnIn" data-clickable title="Zoom in (=)">+</button>
    <span id="zoomLabel">1.0×</span>
    <button id="btnReset" data-clickable title="Reset (0)">⟲</button>
    <button id="btnClose" data-clickable title="Hide (z)">✕</button>
  </div>
  <div id="rotateRow">
    <button id="rotateCounterclockwise" data-clickable title="Rotate counterclockwise">−</button>
    <input id="rotateSlider" data-clickable type="range" min="-180" max="180" step="1" value="0" title="Rotation" />
    <button id="rotateClockwise" data-clickable title="Rotate clockwise">+</button>
    <span id="rotateLabel">0°</span>
  </div>
</div>

<script>
  const magnifier = document.getElementById("magnifier");
  const frame = document.getElementById("frame");
  const viewport = document.getElementById("viewport");
  const zoomLabel = document.getElementById("zoomLabel");
  const zoomSlider = document.getElementById("zoomSlider");
  const rotateLabel = document.getElementById("rotateLabel");
  const rotateSlider = document.getElementById("rotateSlider");
  const panUp = document.getElementById("panUp");
  const panDown = document.getElementById("panDown");
  const panLeft = document.getElementById("panLeft");
  const panRight = document.getElementById("panRight");
  const PAN_ARROW_SIZE = 14;

  let state = { zoom: 0, panX: 0, panY: 0, rotation: 0, visible: false, aspect: 16 / 9 };

  iina.onMessage("state", (s) => {
    state = s;
    render();
  });

  function render() {
    magnifier.classList.toggle("visible", state.visible);
    if (!state.visible) return;

    const scale = Math.pow(2, state.zoom);
    const frameW = frame.clientWidth;
    frame.style.height = `${frameW / state.aspect}px`;
    const frameH = frame.clientHeight;

    // Viewport center in normalized video coords: (0.5 − panX, 0.5 − panY);
    // its size is 1/scale of the frame.
    const size = 1 / scale;
    const left = (0.5 - state.panX - size / 2) * frameW;
    const top = (0.5 - state.panY - size / 2) * frameH;

    const viewW = size * frameW;
    const viewH = size * frameH;
    viewport.style.width = `${viewW}px`;
    viewport.style.height = `${viewH}px`;
    viewport.style.left = `${left}px`;
    viewport.style.top = `${top}px`;

    placePanArrow(panUp, left + viewW / 2 - PAN_ARROW_SIZE / 2, top - PAN_ARROW_SIZE, frameW, frameH);
    placePanArrow(panDown, left + viewW / 2 - PAN_ARROW_SIZE / 2, top + viewH, frameW, frameH);
    placePanArrow(panLeft, left - PAN_ARROW_SIZE, top + viewH / 2 - PAN_ARROW_SIZE / 2, frameW, frameH);
    placePanArrow(panRight, left + viewW, top + viewH / 2 - PAN_ARROW_SIZE / 2, frameW, frameH);

    const panLimit = Math.max(0, 0.5 - 1 / (2 * scale));
    const edgeSlack = 0.0001;
    const againstLeftEdge = state.panX >= panLimit - edgeSlack;
    const againstRightEdge = state.panX <= -panLimit + edgeSlack;
    const againstTopEdge = state.panY >= panLimit - edgeSlack;
    const againstBottomEdge = state.panY <= -panLimit + edgeSlack;
    panLeft.classList.toggle("against-edge", againstLeftEdge);
    panRight.classList.toggle("against-edge", againstRightEdge);
    panUp.classList.toggle("against-edge", againstTopEdge);
    panDown.classList.toggle("against-edge", againstBottomEdge);

    zoomLabel.textContent = `${scale.toFixed(1)}×`;
    zoomSlider.value = state.zoom;
    rotateLabel.textContent = `${state.rotation}°`;
    rotateSlider.value = state.rotation;
  }

  // ── Pan: drag the viewport, or click/drag anywhere in the frame ────────────

  function panToEvent(e) {
    const rect = frame.getBoundingClientRect();
    const u = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const v = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    iina.postMessage("pan", { u, v });
  }

  function placePanArrow(button, x, y, frameW, frameH) {
    const clampedX = Math.min(frameW - PAN_ARROW_SIZE, Math.max(0, x));
    const clampedY = Math.min(frameH - PAN_ARROW_SIZE, Math.max(0, y));
    button.style.left = `${clampedX}px`;
    button.style.top = `${clampedY}px`;
  }

  function holdPanArrow(button, stepsRight, stepsDown) {
    let arrowIsHeld = false;
    let delayBeforeRepeat = null;
    let repeatTimer = null;

    function releaseArrow() {
      arrowIsHeld = false;
      clearTimeout(delayBeforeRepeat);
      clearInterval(repeatTimer);
    }

    function sendPanStep() {
      if (button.classList.contains("against-edge")) return;
      iina.postMessage("panBy", { stepsRight, stepsDown });
    }

    function pressArrow(e) {
      e.preventDefault();
      e.stopPropagation();
      if (arrowIsHeld) return;
      arrowIsHeld = true;
      if (e.pointerId !== undefined) button.setPointerCapture(e.pointerId);
      sendPanStep();
      delayBeforeRepeat = setTimeout(() => {
        repeatTimer = setInterval(sendPanStep, 80);
      }, 280);
    }

    button.addEventListener("pointerdown", pressArrow);
    button.addEventListener("mousedown", pressArrow);
    button.addEventListener("pointerup", releaseArrow);
    button.addEventListener("pointercancel", releaseArrow);
    document.addEventListener("mouseup", releaseArrow);
  }

  holdPanArrow(panUp, 0, -1);
  holdPanArrow(panDown, 0, 1);
  holdPanArrow(panLeft, -1, 0);
  holdPanArrow(panRight, 1, 0);

  frame.addEventListener("mousedown", (e) => {
    if (e.target.closest(".pan-arrow")) return;
    e.preventDefault();
    viewport.classList.add("dragging");
    panToEvent(e);

    function onMove(ev) { panToEvent(ev); }
    function onUp() {
      viewport.classList.remove("dragging");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  // Scroll over the navigator to zoom
  frame.addEventListener("wheel", (e) => {
    e.preventDefault();
    iina.postMessage("zoom", { delta: e.deltaY < 0 ? 0.25 : -0.25 });
  });

  // ── Toolbar ─────────────────────────────────────────────────────────────────

  zoomSlider.addEventListener("input", () =>
    iina.postMessage("zoomTo", { zoom: parseFloat(zoomSlider.value) })
  );

  document.getElementById("btnIn").addEventListener("click", () =>
    iina.postMessage("zoom", { delta: 0.25 })
  );
  document.getElementById("btnOut").addEventListener("click", () =>
    iina.postMessage("zoom", { delta: -0.25 })
  );
  document.getElementById("btnReset").addEventListener("click", () =>
    iina.postMessage("reset", {})
  );
  document.getElementById("btnClose").addEventListener("click", () =>
    iina.postMessage("close", {})
  );

  rotateSlider.addEventListener("input", () =>
    iina.postMessage("rotateTo", { rotation: parseInt(rotateSlider.value, 10) })
  );
  document.getElementById("rotateClockwise").addEventListener("click", () =>
    iina.postMessage("rotate", { delta: 1 })
  );
  document.getElementById("rotateCounterclockwise").addEventListener("click", () =>
    iina.postMessage("rotate", { delta: -1 })
  );
</script>
</body>
</html>
